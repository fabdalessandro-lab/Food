<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MacroLens" />
  <title>MacroLens — AI Nutrition Tracker</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Pinned versions (cached by sw.js so the app also opens offline) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <style>
    body {
      background-color: #09090B;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      -webkit-text-size-adjust: 100%;
    }
    /* 16px inputs stop iOS from zooming the page when a field is focused */
    input, textarea, select { font-size: 16px !important; }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #09090B; }
    ::-webkit-scrollbar-thumb { background: #27272A; border-radius: 3px; }
  </style>
</head>
<body class="bg-[#09090B] text-[#FAFAFA] antialiased selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      const icons = {
        flame: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        camera: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z M15 13a3 3 0 11-6 0 3 3 0 016 0z" />,
        mic: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />,
        scale: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        book: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
        chart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z" />,
        utensils: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3v7a4 4 0 004 4h1v7h2v-7h1a4 4 0 004-4V3h-2v5h-2V3H9v5H7V3H5zm13 0v10h2v8h2V3c-2.21 0-4 1.79-4 4z" />,
        x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
        chevronDown: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />,
        chevronUp: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 15l7-7 7 7" />
      };
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name]}
        </svg>
      );
    };

    const COMMON_STAPLES = [
      { name: 'Chicken Breast (Cooked)', cal: 165, p: 31.0, c: 0.0, f: 3.6, fib: 0.0, defaultG: 180 },
      { name: 'Lean Ground Beef (5% Fat)', cal: 137, p: 21.4, c: 0.0, f: 5.0, fib: 0.0, defaultG: 150 },
      { name: 'Cooked Jasmine / White Rice', cal: 130, p: 2.7, c: 28.2, f: 0.3, fib: 0.4, defaultG: 200 },
      { name: 'Rolled Oats (Dry)', cal: 389, p: 16.9, c: 66.3, f: 6.9, fib: 10.6, defaultG: 80 },
      { name: 'Skyr / 0% Greek Yogurt', cal: 63, p: 11.0, c: 4.0, f: 0.2, fib: 0.0, defaultG: 250 },
      { name: 'Whey Protein Isolate', cal: 370, p: 82.0, c: 4.0, f: 2.0, fib: 0.0, defaultG: 35 },
      { name: 'Whole Eggs (1 Large ~50g)', cal: 143, p: 12.6, c: 0.7, f: 9.5, fib: 0.0, defaultG: 150 },
      { name: 'Extra Virgin Olive Oil', cal: 884, p: 0.0, c: 0.0, f: 100.0, fib: 0.0, defaultG: 10 },
      { name: 'Salmon Fillet (Raw)', cal: 208, p: 20.4, c: 0.0, f: 13.4, fib: 0.0, defaultG: 160 },
      { name: 'Steamed Broccoli', cal: 35, p: 2.4, c: 7.2, f: 0.4, fib: 3.3, defaultG: 120 },
      { name: 'Feta Cheese', cal: 265, p: 14.2, c: 4.1, f: 21.3, fib: 0.0, defaultG: 50 },
    ];

    const QUICK_LABELS = { calories: 'Calories (kcal)', protein: 'Protein (g)', carbs: 'Carbs (g)', fat: 'Fat (g)', fiber: 'Fiber (g)', weight_g: 'Portion weight (g)' };
    const DEFAULT_GOALS = { calories: 2400, protein: 180, carbs: 250, fat: 75, fiber: 35 };
    // Local-date helpers (toISOString() is UTC and shifts evening meals to tomorrow)
    const toDateStr = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    };
    const getTodayStr = () => toDateStr(new Date());

    let _uid = 0;
    const uid = () => `${Date.now().toString(36)}-${(_uid++).toString(36)}-${Math.random().toString(36).slice(2, 6)}`;

    // Safe localStorage (private mode / corrupted data must never white-screen the app)
    const loadJson = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) { return fallback; }
    };
    const saveJson = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage full or blocked */ }
    };

    // Shrink phone photos before upload (full-size photos are several MB)
    const downscaleImage = (file, maxSide = 1024, quality = 0.8) => new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image. Try a JPEG or PNG photo.')); };
      img.src = url;
    });

    // ---- item / food helpers ----
    const scaleItem = (it, w) => {
      const r = it.base_weight_g > 0 ? w / it.base_weight_g : 1;
      return {
        ...it,
        weight_g: w,
        calories: Math.round((it.base_calories || 0) * r),
        protein: Number(((it.base_protein || 0) * r).toFixed(1)),
        carbs: Number(((it.base_carbs || 0) * r).toFixed(1)),
        fat: Number(((it.base_fat || 0) * r).toFixed(1)),
        fiber: Number(((it.base_fiber || 0) * r).toFixed(1)),
      };
    };
    // Ingredient with macros given for the stated weight
    const makeItem = (o) => {
      const w = Number(o.weight_g) > 0 ? Number(o.weight_g) : 100;
      return scaleItem({
        id: uid(), name: o.name || 'Ingredient', unit: 'g',
        weight_g: w, base_weight_g: w,
        base_calories: Number(o.calories) || 0, base_protein: Number(o.protein) || 0,
        base_carbs: Number(o.carbs) || 0, base_fat: Number(o.fat) || 0, base_fiber: Number(o.fiber) || 0,
      }, w);
    };
    const stapleToItem = (st) => scaleItem({
      id: uid(), name: st.name, unit: 'g', weight_g: st.defaultG, base_weight_g: 100,
      base_calories: st.cal, base_protein: st.p, base_carbs: st.c, base_fat: st.f, base_fiber: st.fib,
    }, st.defaultG);
    const sumItems = (items) => items.reduce((a, i) => ({
      calories: a.calories + (Number(i.calories) || 0),
      protein: a.protein + (Number(i.protein) || 0),
      carbs: a.carbs + (Number(i.carbs) || 0),
      fat: a.fat + (Number(i.fat) || 0),
      fiber: a.fiber + (Number(i.fiber) || 0),
    }), { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 });
    const perServing = (food) => {
      const n = Math.max(Number(food.servings) || 1, 0.0001);
      const t = food.totals || {};
      return { calories: (t.calories || 0) / n, protein: (t.protein || 0) / n, carbs: (t.carbs || 0) / n, fat: (t.fat || 0) / n, fiber: (t.fiber || 0) / n };
    };
    // A saved food as a loggable item: by serving (default) or by grams of the finished dish
    const foodToItem = (food, mode = 'serving', qty) => {
      const t = food.totals || {};
      if (mode === 'g' && food.totalWeight > 0) {
        const n = Math.max(Number(food.servings) || 1, 0.0001);
        return scaleItem({
          id: uid(), name: food.name, unit: 'g', weight_g: food.totalWeight, base_weight_g: food.totalWeight,
          base_calories: t.calories || 0, base_protein: t.protein || 0, base_carbs: t.carbs || 0, base_fat: t.fat || 0, base_fiber: t.fiber || 0,
        }, qty != null ? qty : Math.round(food.totalWeight / n));
      }
      const p = perServing(food);
      return scaleItem({
        id: uid(), name: food.name, unit: food.unitLabel || 'serving', weight_g: 1, base_weight_g: 1,
        base_calories: p.calories, base_protein: p.protein, base_carbs: p.carbs, base_fat: p.fat, base_fiber: p.fiber,
      }, qty != null ? qty : 1);
    };
    const EMPTY_INGREDIENT = { name: '', weight_g: '', calories: '', protein: '', carbs: '', fat: '', fiber: '' };

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      render() {
        if (!this.state.err) return this.props.children;
        return (
          <div className="p-6 space-y-3 text-sm">
            <p className="font-semibold">Something went wrong.</p>
            <p className="text-xs text-zinc-400 break-words">{String(this.state.err && this.state.err.message)}</p>
            <button onClick={() => window.location.reload()} className="bg-blue-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl">Reload app</button>
          </div>
        );
      }
    }

    const shiftDate = (str, delta) => {
      const [y, m, d] = str.split('-').map(Number);
      return toDateStr(new Date(y, m - 1, d + delta));
    };
    const formatDay = (str) => {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
    };

    // Attach photos for the AI: take one with the camera or pick from the library (up to `max`)
    const PhotoAttach = ({ images, onChange, onError, max = 4 }) => {
      const addFiles = async (e) => {
        const files = Array.from(e.target.files || []).slice(0, Math.max(0, max - images.length));
        e.target.value = '';
        if (files.length === 0) return;
        try {
          const added = [];
          for (const f of files) added.push(await downscaleImage(f));
          onChange([...images, ...added]);
        } catch (err) {
          if (onError) onError(err.message);
        }
      };
      const full = images.length >= max;
      const btn = `flex-1 flex items-center justify-center gap-1.5 bg-zinc-900 border border-zinc-800 rounded-xl py-2.5 text-xs font-medium text-zinc-200 cursor-pointer ${full ? 'opacity-40 pointer-events-none' : ''}`;
      return (
        <div className="space-y-2">
          {images.length > 0 && (
            <div className="flex gap-2 flex-wrap">
              {images.map((src, i) => (
                <div key={i} className="relative">
                  <img src={src} alt={`Attached photo ${i + 1}`} className="w-16 h-16 object-cover rounded-lg border border-zinc-700" />
                  <button onClick={() => onChange(images.filter((_, j) => j !== i))} aria-label="Remove photo" className="absolute -top-1.5 -right-1.5 bg-zinc-800 border border-zinc-600 rounded-full p-0.5"><Icon name="x" className="w-3 h-3" /></button>
                </div>
              ))}
            </div>
          )}
          <div className="flex gap-2">
            <label className={btn}>
              <Icon name="camera" /> Take photo
              <input type="file" accept="image/*" capture="environment" onChange={addFiles} className="hidden" />
            </label>
            <label className={btn}>
              <Icon name="plus" /> Upload
              <input type="file" accept="image/*" multiple onChange={addFiles} className="hidden" />
            </label>
          </div>
          {full && <p className="text-[11px] text-zinc-500">Maximum of {max} photos.</p>}
        </div>
      );
    };

    // ---- barcode lookup (Open Food Facts, free, no key; values are per 100 g) ----
    const lookupBarcode = async (code) => {
      let res;
      try {
        res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`);
      } catch (e) {
        throw new Error('No connection. Barcode lookup needs internet.');
      }
      if (res.status === 404) return null;
      if (!res.ok) throw new Error(`Lookup failed (${res.status}). Try again in a moment.`);
      const data = await res.json();
      if (!data || data.status === 0 || !data.product) return null;
      const p = data.product;
      const n = p.nutriments || {};
      const num = (v) => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
      let kcal = num(n['energy-kcal_100g']);
      if (!kcal && n['energy_100g']) kcal = Math.round(num(n['energy_100g']) / 4.184);
      const brand = p.brands ? String(p.brands).split(',')[0].trim() : '';
      const name = [brand, p.product_name].filter(Boolean).join(' ') || `Product ${code}`;
      return {
        code, name, hasEnergy: kcal > 0, servingG: num(p.serving_quantity),
        per100: { calories: kcal, protein: num(n.proteins_100g), carbs: num(n.carbohydrates_100g), fat: num(n.fat_100g), fiber: num(n.fiber_100g) },
      };
    };

    const BarcodeScanner = ({ onAdd, onClose }) => {
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const [status, setStatus] = useState('starting'); // starting | scanning | unsupported | loading | result | notfound | error
      const [message, setMessage] = useState('');
      const [manualCode, setManualCode] = useState('');
      const [product, setProduct] = useState(null);
      const [vals, setVals] = useState(null);
      const [grams, setGrams] = useState('100');

      const stopCamera = () => {
        if (streamRef.current) { streamRef.current.getTracks().forEach((t) => t.stop()); streamRef.current = null; }
      };

      const doLookup = async (code) => {
        stopCamera();
        setStatus('loading'); setMessage('');
        try {
          const p = await lookupBarcode(code);
          if (!p) { setStatus('notfound'); setMessage(`No product found for ${code}. Try the label photo under Describe meal, or enter it by hand.`); return; }
          setProduct(p);
          setVals({ calories: String(p.per100.calories), protein: String(p.per100.protein), carbs: String(p.per100.carbs), fat: String(p.per100.fat), fiber: String(p.per100.fiber) });
          setGrams(String(p.servingG > 0 ? Math.round(p.servingG) : 100));
          setStatus('result');
        } catch (e) {
          setStatus('error'); setMessage(e.message);
        }
      };

      const startCamera = async () => {
        setStatus('starting'); setMessage('');
        if (!('BarcodeDetector' in window) || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
          setStatus('unsupported'); setMessage('This browser cannot scan barcodes. Type the number below instead.');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
          streamRef.current = stream;
          const v = videoRef.current;
          v.srcObject = stream;
          await v.play();
          setStatus('scanning');
          const detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
          const tick = async () => {
            if (!streamRef.current) return;
            try {
              const codes = await detector.detect(v);
              if (codes.length > 0 && streamRef.current) { doLookup(codes[0].rawValue); return; }
            } catch (e) { /* video not ready yet */ }
            setTimeout(tick, 250);
          };
          tick();
        } catch (e) {
          setStatus('unsupported');
          setMessage('Camera access was blocked. Allow the camera for this site in your browser settings, or type the number below.');
        }
      };

      useEffect(() => { startCamera(); return stopCamera; }, []);

      const submitManual = () => {
        const code = manualCode.replace(/\D/g, '');
        if (code.length < 8 || code.length > 14) { setMessage('Enter the 8 to 14 digit number printed under the barcode.'); return; }
        doLookup(code);
      };

      const g = Number(grams) > 0 ? Number(grams) : 0;
      const n = (k) => Number(vals && vals[k]) || 0;
      const preview = (k) => (n(k) * g) / 100;
      const add = () => {
        if (!(g > 0) || !product) return;
        onAdd(scaleItem({
          id: uid(), name: product.name, unit: 'g', weight_g: g, base_weight_g: 100,
          base_calories: n('calories'), base_protein: n('protein'), base_carbs: n('carbs'), base_fat: n('fat'), base_fiber: n('fiber'),
        }, g));
        onClose();
      };
      const showCamera = status === 'starting' || status === 'scanning';
      const canType = status !== 'result' && status !== 'loading';

      return (
        <div className="fixed inset-0 z-[60] bg-black flex flex-col safe-top safe-bottom">
          <div className="flex items-center justify-between px-4 py-3">
            <h3 className="text-sm font-semibold">Scan barcode</h3>
            <button onClick={() => { stopCamera(); onClose(); }} aria-label="Close" className="p-2 -mr-2 text-zinc-300"><Icon name="x" /></button>
          </div>
          <div className="flex-1 overflow-y-auto px-4 pb-4 space-y-3">
            <div className={`relative rounded-2xl overflow-hidden bg-zinc-900 ${showCamera ? 'block' : 'hidden'}`}>
              <video ref={videoRef} playsInline muted className="w-full max-h-[50dvh] object-cover" />
              <div className="absolute inset-x-8 top-1/2 -translate-y-1/2 h-24 border-2 border-emerald-400/80 rounded-xl pointer-events-none" />
              <p className="absolute bottom-2 inset-x-0 text-center text-[11px] text-zinc-200">{status === 'starting' ? 'Starting camera…' : 'Point at the barcode'}</p>
            </div>

            {status === 'loading' && <p className="text-xs text-zinc-300 text-center py-8">Looking up product…</p>}
            {message && status !== 'result' && <div className="bg-zinc-900 border border-zinc-800 text-zinc-200 text-xs p-3 rounded-xl">{message}</div>}

            {canType && (
              <div className="space-y-2">
                <div className="flex gap-2">
                  <input type="text" inputMode="numeric" value={manualCode} onChange={(e) => setManualCode(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submitManual(); }} placeholder="Or type the barcode number" className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs" />
                  <button onClick={submitManual} className="bg-blue-600 text-white text-xs px-4 py-2 rounded-xl">Look up</button>
                </div>
                {(status === 'notfound' || status === 'error' || status === 'unsupported') && (
                  <button onClick={startCamera} className="w-full bg-zinc-800 text-xs font-medium py-2.5 rounded-xl">Scan again</button>
                )}
              </div>
            )}

            {status === 'result' && product && vals && (
              <div className="bg-[#18181B] border border-[#27272A] rounded-2xl p-4 space-y-3">
                <div>
                  <p className="text-sm font-semibold">{product.name}</p>
                  <p className="text-[11px] text-zinc-500">Barcode {product.code} · Open Food Facts</p>
                </div>
                {!product.hasEnergy && <p className="text-[11px] text-amber-300">This product has no calorie data. Check the values below against the label.</p>}
                <p className="text-[11px] text-zinc-400">Per 100 g (edit if the label differs)</p>
                <div className="grid grid-cols-5 gap-1.5">
                  {[['calories', 'kcal'], ['protein', 'P'], ['carbs', 'C'], ['fat', 'F'], ['fiber', 'Fib']].map(([k, label]) => (
                    <div key={k}>
                      <label className="text-[10px] text-zinc-500 block text-center">{label}</label>
                      <input type="number" inputMode="decimal" value={vals[k]} onChange={(e) => setVals({ ...vals, [k]: e.target.value })} aria-label={`${label} per 100 g`} className="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-1 py-1.5 text-center" />
                    </div>
                  ))}
                </div>
                <div className="flex items-center gap-2 text-xs">
                  <label htmlFor="scan-grams" className="text-zinc-400">Amount</label>
                  <input id="scan-grams" type="number" inputMode="decimal" value={grams} onChange={(e) => setGrams(e.target.value)} className="w-24 bg-zinc-900 border border-zinc-800 rounded-lg px-2 py-1.5 text-center" />
                  <span className="text-zinc-400">g</span>
                </div>
                <p className="text-xs"><span className="font-medium">{Math.round(preview('calories'))} kcal</span> · {preview('protein').toFixed(1)}g P · {preview('carbs').toFixed(1)}g C · {preview('fat').toFixed(1)}g F</p>
                <div className="flex gap-2">
                  <button onClick={startCamera} className="flex-1 bg-zinc-800 text-xs font-medium py-3 rounded-xl">Scan another</button>
                  <button onClick={add} disabled={!(g > 0)} className="flex-1 bg-emerald-600 disabled:opacity-40 text-white text-xs font-semibold py-3 rounded-xl">Add</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Gemini request with retries (Google returns 503 "high demand" in busy spells) and a backup model
    const RETRYABLE_STATUS = [429, 500, 502, 503, 504];
    const callGemini = async (apiKey, models, prompt, images = [], sleepFn = (ms) => new Promise((r) => setTimeout(r, ms))) => {
      const parts = [{ text: prompt }];
      images.forEach((img) => {
        parts.push({ inlineData: { mimeType: 'image/jpeg', data: img.split(',')[1] || img } });
      });
      const body = JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2 } });
      let data = null;
      let firstMessage = '';
      outer:
      for (let mi = 0; mi < models.length; mi++) {
        const attempts = mi === 0 ? 3 : 2;
        for (let a = 0; a < attempts; a++) {
          let res;
          try {
            res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${models[mi]}:generateContent`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
              body,
            });
          } catch (e) {
            throw new Error('No connection. AI features need internet. Check your signal and try again.');
          }
          if (res.ok) { data = await res.json(); break outer; }
          const err = await res.json().catch(() => ({}));
          const message = (err && err.error && err.error.message) || `API error (${res.status}). Check your Gemini key in Goals.`;
          if (mi === 0 && !firstMessage) firstMessage = message;
          if (!RETRYABLE_STATUS.includes(res.status)) {
            if (mi === 0) throw new Error(message);   // key or model problem: tell the user
            break;                                    // backup model unusable: fall through to the busy message
          }
          if (a < attempts - 1) await sleepFn(1500 * (a + 1));
        }
      }
      if (!data) throw new Error('Google\'s AI is busy right now. The app retried and tried the backup model. Wait a minute and tap the button again.');
      const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map((p) => p.text || '').join('');
      try {
        return JSON.parse(stripFences(text));
      } catch (e) {
        throw new Error('The AI reply could not be read. Please try again.');
      }
    };

    // ---- meal categories ----
    const CATEGORIES = ['Breakfast', 'Lunch', 'Dinner', 'Snack', 'Other'];
    const categoryForTime = (h, m = 0) => {
      const t = h * 60 + m;
      if (t >= 240 && t < 630) return 'Breakfast';   // 04:00 - 10:29
      if (t >= 630 && t < 870) return 'Lunch';       // 10:30 - 14:29
      if (t >= 870 && t < 1020) return 'Snack';      // 14:30 - 16:59
      if (t >= 1020 && t < 1290) return 'Dinner';    // 17:00 - 21:29
      return 'Snack';                                // late night
    };
    const autoCategory = () => { const d = new Date(); return categoryForTime(d.getHours(), d.getMinutes()); };
    // Meals saved before categories existed get one from their logged time
    const mealCategory = (m) => {
      if (m && CATEGORIES.includes(m.category)) return m.category;
      const x = /(\d{1,2}):(\d{2})\s*([AaPp])?/.exec((m && m.time) || '');
      if (!x) return 'Other';
      let h = Number(x[1]);
      if (x[3]) h = (h % 12) + (/[Pp]/.test(x[3]) ? 12 : 0);
      return categoryForTime(h, Number(x[2]));
    };

    const cloneItems = (items) => items.map((i) => ({ ...i, id: uid() }));
    const nowTime = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const stripFences = (t) => String(t || '').replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
    const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedDate, setSelectedDate] = useState(getTodayStr());

      const [goals, setGoals] = useState(() => ({ ...DEFAULT_GOALS, ...loadJson('macrolens_goals', {}) }));
      const [meals, setMeals] = useState(() => {
        const m = loadJson('macrolens_meals', []);
        return Array.isArray(m) ? m.filter((x) => x && Array.isArray(x.items)) : [];
      });
      const [customFoods, setCustomFoods] = useState(() => {
        const f = loadJson('macrolens_foods', []);
        return Array.isArray(f) ? f.filter((x) => x && x.id && Array.isArray(x.ingredients) && x.totals) : [];
      });
      const [savedRecipes, setSavedRecipes] = useState(() => {
        const r = loadJson('macrolens_recipes', []);
        return Array.isArray(r) ? r : [];
      });
      const [apiKey, setApiKey] = useState(() => {
        try { return localStorage.getItem('macrolens_gemini_key') || ''; } catch (e) { return ''; }
      });

      const [model, setModel] = useState(() => {
        try { return localStorage.getItem('macrolens_model') || 'gemini-3.8-flash'; } catch (e) { return 'gemini-3.8-flash'; }
      });
      useEffect(() => { try { localStorage.setItem('macrolens_model', model); } catch (e) {} }, [model]);
      const [backupModel, setBackupModel] = useState(() => {
        try {
          const v = localStorage.getItem('macrolens_model_backup');
          return v === null ? 'gemini-flash-lite-latest' : v;
        } catch (e) { return 'gemini-flash-lite-latest'; }
      });
      useEffect(() => { try { localStorage.setItem('macrolens_model_backup', backupModel); } catch (e) {} }, [backupModel]);

      useEffect(() => { saveJson('macrolens_goals', goals); }, [goals]);
      useEffect(() => { saveJson('macrolens_foods', customFoods); }, [customFoods]);

      const [trainingGoals, setTrainingGoals] = useState(() => {
        const stored = loadJson('macrolens_training_goals', null);
        if (stored) return { ...DEFAULT_GOALS, ...stored };
        return { ...goals, calories: goals.calories + 300, carbs: goals.carbs + 75 };
      });
      const [dayOverrides, setDayOverrides] = useState(() => {
        const o = loadJson('macrolens_day_types', {});
        return o && typeof o === 'object' && !Array.isArray(o) ? o : {};
      });
      const [trainingWeekdays, setTrainingWeekdays] = useState(() => {
        const w = loadJson('macrolens_training_weekdays', []);
        return Array.isArray(w) ? w.filter((n) => Number.isInteger(n) && n >= 0 && n <= 6) : [];
      });
      const [favorites, setFavorites] = useState(() => {
        const f = loadJson('macrolens_favorites', []);
        return Array.isArray(f) ? f.filter((x) => x && x.name && Array.isArray(x.items)) : [];
      });
      const [goalsTab, setGoalsTab] = useState('standard');
      const [toast, setToast] = useState(null);
      const [copyOpen, setCopyOpen] = useState(false);
      const [copySource, setCopySource] = useState('');
      const [copyUnchecked, setCopyUnchecked] = useState({});
      const [editingMealId, setEditingMealId] = useState(null);
      const [editDate, setEditDate] = useState('');
      useEffect(() => { saveJson('macrolens_training_goals', trainingGoals); }, [trainingGoals]);
      useEffect(() => { saveJson('macrolens_day_types', dayOverrides); }, [dayOverrides]);
      useEffect(() => { saveJson('macrolens_training_weekdays', trainingWeekdays); }, [trainingWeekdays]);
      useEffect(() => { saveJson('macrolens_favorites', favorites); }, [favorites]);
      useEffect(() => {
        if (!toast) return undefined;
        const t = setTimeout(() => setToast(null), 6000);
        return () => clearTimeout(t);
      }, [toast]);

      // Standard vs training day: a per-date switch wins, otherwise the usual training weekdays decide
      const dayTypeFor = (dateStr) => {
        if (dayOverrides[dateStr] === 'training' || dayOverrides[dateStr] === 'standard') return dayOverrides[dateStr];
        const [y, m, d] = dateStr.split('-').map(Number);
        return trainingWeekdays.includes(new Date(y, m - 1, d).getDay()) ? 'training' : 'standard';
      };
      const goalsFor = (dateStr) => dayTypeFor(dateStr) === 'training' ? trainingGoals : goals;
      const dayType = dayTypeFor(selectedDate);
      const activeGoals = goalsFor(selectedDate);
      const editingTraining = goalsTab === 'training';
      const editGoals = editingTraining ? trainingGoals : goals;
      const setEditGoals = editingTraining ? setTrainingGoals : setGoals;
      useEffect(() => { saveJson('macrolens_meals', meals); }, [meals]);
      useEffect(() => { saveJson('macrolens_recipes', savedRecipes); }, [savedRecipes]);
      useEffect(() => { try { localStorage.setItem('macrolens_gemini_key', apiKey); } catch (e) {} }, [apiKey]);

      const [backupMsg, setBackupMsg] = useState('');
      const [installPrompt, setInstallPrompt] = useState(null);
      useEffect(() => {
        const onPrompt = (e) => { e.preventDefault(); setInstallPrompt(e); };
        window.addEventListener('beforeinstallprompt', onPrompt);
        return () => window.removeEventListener('beforeinstallprompt', onPrompt);
      }, []);

      const [trackModalOpen, setTrackModalOpen] = useState(false);
      const [trackMode, setTrackMode] = useState('hub');
      const [trackCategory, setTrackCategory] = useState(() => autoCategory());
      const [reviewFromAi, setReviewFromAi] = useState(false);
      const [aiThread, setAiThread] = useState([]);
      const [followUp, setFollowUp] = useState('');
      const [followLoading, setFollowLoading] = useState(false);
      const [manualSubMode, setManualSubMode] = useState('builder');
      const [manualMealName, setManualMealName] = useState('');
      const [quickMacros, setQuickMacros] = useState({ calories: '', protein: '', carbs: '', fat: '', fiber: '', weight_g: 100 });
      const [draftItems, setDraftItems] = useState([]);

      const [aiPromptText, setAiPromptText] = useState('');
      const [aiPhotos, setAiPhotos] = useState([]);
      const [recipePhotos, setRecipePhotos] = useState([]);
      const [foodPhotos, setFoodPhotos] = useState([]);
      const [photoHint, setPhotoHint] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [aiError, setAiError] = useState('');
      const [isListening, setIsListening] = useState(false);
      const recognitionRef = useRef(null);

      const [expandedMealId, setExpandedMealId] = useState(null);
      const [recipeSubTab, setRecipeSubTab] = useState('saved');
      const [foodModalOpen, setFoodModalOpen] = useState(false);
      const [foodDraft, setFoodDraft] = useState(null);
      const [foodAiText, setFoodAiText] = useState('');
      const [foodError, setFoodError] = useState('');
      const [foodLoading, setFoodLoading] = useState(false);
      const [foodManual, setFoodManual] = useState(EMPTY_INGREDIENT);
      const [foodQty, setFoodQty] = useState({});
      const [scanOpen, setScanOpen] = useState(null); // null | 'meal' | 'food'
      const [recipeQuery, setRecipeQuery] = useState('');
      const [aiGeneratedRecipes, setAiGeneratedRecipes] = useState([]);
      const [isRecipeLoading, setIsRecipeLoading] = useState(false);
      const [portionMultiplier, setPortionMultiplier] = useState({});
      const [analyticsView, setAnalyticsView] = useState('week');
      const analyticsRange = analyticsView === 'month' ? 30 : 7;

      const callGeminiJson = async (prompt, images = []) => {
        if (!apiKey.trim()) {
          throw new Error('Please paste your free Gemini API Key in the Goals/Settings tab first.');
        }
        const models = [(model || '').trim() || 'gemini-3.8-flash', (backupModel || '').trim()].filter(Boolean);
        return callGemini(apiKey.trim(), models, prompt, images);
      };

      const toggleVoiceDictation = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setAiError('Voice dictation is not available here. Type your meal and use the keyboard microphone instead.');
          return;
        }
        if (isListening) {
          recognitionRef.current?.stop();
          setIsListening(false);
          return;
        }
        const rec = new SpeechRecognition();
        rec.lang = 'en-US';
        rec.onstart = () => setIsListening(true);
        rec.onend = () => setIsListening(false);
        rec.onerror = () => { setIsListening(false); setAiError('Dictation stopped. Type your meal or use the keyboard microphone.'); };
        rec.onresult = (e) => {
          const t = e.results[0][0].transcript;
          setAiPromptText((p) => (p ? `${p} ${t}` : t));
        };
        recognitionRef.current = rec;
        rec.start();
      };

      const handleAiAnalyzeMeal = async (mode) => {
        setAiError('');
        setIsAiLoading(true);
        try {
          const text = (mode === 'photo' ? photoHint : aiPromptText).trim();
          const hasPhotos = aiPhotos.length > 0;
          const prompt = `You are a sports nutritionist.${hasPhotos ? ' Look at the attached photo(s): they may show a meal, food packaging or a nutrition label.' : ''}${text ? ` The user says: "${text}".` : ''}
               Identify each ingredient, give its weight in grams (weight_g), and calculate calories, protein (g), carbs (g), fat (g), and fiber (g) for that weight. If the text or a nutrition label states values for a product (for example per 100g), use those exact numbers scaled to the amount eaten instead of estimating. Estimate weights only when none are given. In "notes", say in at most 2 short sentences which assumptions you made (for example portion sizes).
               Return strictly JSON: { "meal_name": "String", "notes": "String", "items": [{ "name": "String", "weight_g": Number, "calories": Number, "protein": Number, "carbs": Number, "fat": Number, "fiber": Number }] }`;

          const result = await callGeminiJson(prompt, aiPhotos);
          setManualMealName(result.meal_name || 'Logged Meal');
          setDraftItems((result.items || []).map(makeItem));
          setReviewFromAi(true);
          setAiThread(result.notes ? [{ role: 'ai', text: String(result.notes) }] : []);
          setFollowUp('');
          setTrackMode('review');
        } catch (err) {
          setAiError(err.message);
        } finally {
          setIsAiLoading(false);
        }
      };

      const updateDraftItemWeight = (id, newWeight) => {
        const w = Math.max(0, Number(newWeight) || 0);
        setDraftItems((prev) => prev.map((it) => {
          if (it.id !== id) return it;
          const r = it.base_weight_g > 0 ? w / it.base_weight_g : 1;
          return {
            ...it,
            weight_g: w,
            calories: Math.round(it.base_calories * r),
            protein: Number((it.base_protein * r).toFixed(1)),
            carbs: Number((it.base_carbs * r).toFixed(1)),
            fat: Number((it.base_fat * r).toFixed(1)),
            fiber: Number((it.base_fiber * r).toFixed(1)),
          };
        }));
      };

      const addStapleToDraft = (s) => {
        const r = s.defaultG / 100;
        setDraftItems((p) => [...p, {
          id: uid(),
          name: s.name,
          weight_g: s.defaultG,
          base_weight_g: 100,
          base_calories: s.cal,
          base_protein: s.p,
          base_carbs: s.c,
          base_fat: s.f,
          base_fiber: s.fib,
          calories: Math.round(s.cal * r),
          protein: Number((s.p * r).toFixed(1)),
          carbs: Number((s.c * r).toFixed(1)),
          fat: Number((s.f * r).toFixed(1)),
          fiber: Number((s.fib * r).toFixed(1)),
        }]);
      };

      const saveMealToLog = () => {
        if (editingMealId) {
          if (draftItems.length === 0) return;
          setMeals((prev) => prev.map((m) => m.id === editingMealId ? { ...m, name: manualMealName.trim() || m.name, category: trackCategory, date: editDate || m.date, items: draftItems } : m));
          closeTrackModal();
          return;
        }
        if (trackMode === 'manual' && manualSubMode === 'quick') {
          const cal = Number(quickMacros.calories) || 0;
          const p = Number(quickMacros.protein) || 0;
          const c = Number(quickMacros.carbs) || 0;
          const f = Number(quickMacros.fat) || 0;
          const fib = Number(quickMacros.fiber) || 0;
          const w = Number(quickMacros.weight_g) || 100;
          if (!cal && !p && !c && !f && !fib) return;
          setMeals((prev) => [{
            id: uid(),
            date: selectedDate,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            category: trackCategory,
            name: manualMealName.trim() || 'Quick Entry',
            items: [{
              id: uid(),
              name: manualMealName.trim() || 'Portion',
              weight_g: w, base_weight_g: w,
              base_calories: cal, base_protein: p, base_carbs: c, base_fat: f, base_fiber: fib,
              calories: Math.round(cal), protein: p, carbs: c, fat: f, fiber: fib
            }]
          }, ...prev]);
        } else {
          if (draftItems.length === 0) return;
          setMeals((prev) => [{
            id: uid(),
            date: selectedDate,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            category: trackCategory,
            name: manualMealName.trim() || 'Logged Meal',
            items: draftItems
          }, ...prev]);
        }
        closeTrackModal();
      };

      const resetTrackForm = () => {
        setManualMealName('');
        setDraftItems([]);
        setAiPromptText('');
        setAiPhotos([]);
        setPhotoHint('');
        setQuickMacros({ calories: '', protein: '', carbs: '', fat: '', fiber: '', weight_g: 100 });
        setAiError('');
        setReviewFromAi(false); setAiThread([]); setFollowUp('');
        setEditingMealId(null);
      };
      const openTrackModal = (mode) => { resetTrackForm(); setTrackCategory(autoCategory()); setTrackMode(mode); setTrackModalOpen(true); };
      const closeTrackModal = () => { setTrackModalOpen(false); setTrackMode('hub'); resetTrackForm(); };

      const handleFollowUp = async () => {
        const q = followUp.trim();
        if (!q || followLoading) return;
        setAiError(''); setFollowLoading(true);
        const thread = [...aiThread, { role: 'user', text: q }];
        setAiThread(thread);
        setFollowUp('');
        try {
          const current = draftItems.map((i) => ({ name: i.name, weight_g: i.weight_g, unit: i.unit || 'g', calories: i.calories, protein: i.protein, carbs: i.carbs, fat: i.fat, fiber: i.fiber }));
          const original = (aiPromptText || photoHint || '').trim();
          const history = thread.slice(0, -1).map((t) => `${t.role === 'user' ? 'User' : 'Assistant'}: ${t.text}`).join(' | ') || 'none';
          const prompt = `You are a sports nutritionist helping the user check a meal before it is logged.
          Original description: "${original}".${aiPhotos.length ? ' The attached photo(s) show the meal, packaging or labels.' : ''}
          Current draft (JSON): ${JSON.stringify({ meal_name: manualMealName, items: current })}
          Conversation so far: ${history}
          The user now says: "${q}"
          If the user corrects, removes or adds foods or amounts, return the complete updated item list (weight_g in grams, macros for that weight). Use exact numbers the user states. If the user only asks a question, answer it and return the items unchanged. Keep the reply to 1-3 short sentences.
          Return strictly JSON: { "reply": "String", "meal_name": "String", "items": [{ "name": "String", "weight_g": Number, "calories": Number, "protein": Number, "carbs": Number, "fat": Number, "fiber": Number }] }`;
          const res = await callGeminiJson(prompt, aiPhotos);
          if (Array.isArray(res.items) && res.items.length > 0) setDraftItems(res.items.map(makeItem));
          if (res.meal_name && !manualMealName.trim()) setManualMealName(String(res.meal_name));
          setAiThread((t) => [...t, { role: 'ai', text: String(res.reply || 'Updated.') }]);
        } catch (err) {
          setAiError(err.message);
        } finally {
          setFollowLoading(false);
        }
      };

      // Copy the items of an earlier meal into the current draft (new ids so they can be edited)
      const addRecentToDraft = (m) => {
        setDraftItems((p) => [...p, ...m.items.map((i) => ({ ...i, id: uid() }))]);
        setManualMealName((n) => n.trim() ? n : m.name);
        setReviewFromAi(false);
        setAiThread([]);
        if (trackMode === 'hub') setTrackMode('review');
      };

      const showToast = (text, undoIds) => setToast({ text, undoIds });
      const undoToast = () => {
        if (toast && toast.undoIds) setMeals((p) => p.filter((m) => !toast.undoIds.includes(m.id)));
        setToast(null);
      };

      // Copy meals to another day (new ids and time; category is kept)
      const copyMealsTo = (list, targetDate, label) => {
        if (list.length === 0) return;
        const copies = list.map((m) => ({ id: uid(), date: targetDate, time: nowTime(), category: mealCategory(m), name: m.name, items: cloneItems(m.items) }));
        setMeals((p) => [...copies, ...p]);
        const where = targetDate === getTodayStr() ? 'today' : formatDay(targetDate);
        showToast(`${label || (copies.length === 1 ? `Copied ${copies[0].name}` : `Copied ${copies.length} meals`)} to ${where}`, copies.map((c) => c.id));
      };
      const openCopy = () => { setCopySource(shiftDate(selectedDate, -1)); setCopyUnchecked({}); setCopyOpen(true); };
      const confirmCopy = () => {
        copyMealsTo(meals.filter((m) => m.date === copySource && !copyUnchecked[m.id]), selectedDate);
        setCopyOpen(false);
      };

      const sameName = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
      const isFavorite = (meal) => favorites.some((f) => sameName(f.name, meal.name));
      const toggleFavorite = (meal) => {
        if (isFavorite(meal)) setFavorites((p) => p.filter((f) => !sameName(f.name, meal.name)));
        else setFavorites((p) => [...p, { id: uid(), name: meal.name, category: mealCategory(meal), items: cloneItems(meal.items) }]);
      };
      const quickAddFavorite = (f) => copyMealsTo([f], selectedDate, `Added ${f.name}`);

      // Edit a logged meal in the same builder used for tracking
      const editMeal = (meal) => {
        resetTrackForm();
        setEditingMealId(meal.id);
        setEditDate(meal.date);
        setManualMealName(meal.name);
        setDraftItems(meal.items.map((i) => ({ ...i })));
        setTrackCategory(mealCategory(meal));
        setManualSubMode('builder');
        setTrackMode('manual');
        setTrackModalOpen(true);
      };

      const updateLoggedItemWeight = (mealId, itemId, newWeight) => {
        const w = Math.max(0, Number(newWeight) || 0);
        setMeals((prev) => prev.map((m) => m.id !== mealId ? m : {
          ...m,
          items: m.items.map((it) => {
            if (it.id !== itemId) return it;
            const r = it.base_weight_g > 0 ? w / it.base_weight_g : 1;
            return {
              ...it,
              weight_g: w,
              calories: Math.round(it.base_calories * r),
              protein: Number((it.base_protein * r).toFixed(1)),
              carbs: Number((it.base_carbs * r).toFixed(1)),
              fat: Number((it.base_fat * r).toFixed(1)),
              fiber: Number((it.base_fiber * r).toFixed(1)),
            };
          })
        }));
      };

      const handleSearchAiRecipes = async (customQ) => {
        const q = customQ || recipeQuery;
        if (!q.trim() && recipePhotos.length === 0) return;
        setIsRecipeLoading(true);
        setAiError('');
        try {
          const prompt = `Generate 3 high-protein recipes${q.trim() ? ` matching: "${q}"` : ''}.${recipePhotos.length ? ' Base them on the attached photo(s): use the ingredients you can see, or recreate the dish shown.' : ''} Include exact gram weights for every ingredient.
          Return strictly JSON: { "recipes": [{ "name": "String", "calories": Number, "protein": Number, "carbs": Number, "fat": Number, "fiber": Number, "ingredients": [{ "name": "String", "weight_g": Number, "calories": Number, "protein": Number, "carbs": Number, "fat": Number, "fiber": Number }] }] }`;
          const res = await callGeminiJson(prompt, recipePhotos);
          setAiGeneratedRecipes(res.recipes || []);
        } catch (err) {
          setAiError(err.message);
        } finally {
          setIsRecipeLoading(false);
        }
      };

      const logRecipeToDiary = (recipe, mult = 1) => {
        const items = (recipe.ingredients || []).map((ing, i) => ({
          id: uid(),
          name: ing.name,
          weight_g: Math.round((ing.weight_g || 100) * mult),
          base_weight_g: ing.weight_g || 100,
          base_calories: ing.calories || 0,
          base_protein: ing.protein || 0,
          base_carbs: ing.carbs || 0,
          base_fat: ing.fat || 0,
          base_fiber: ing.fiber || 0,
          calories: Math.round((ing.calories || 0) * mult),
          protein: Number(((ing.protein || 0) * mult).toFixed(1)),
          carbs: Number(((ing.carbs || 0) * mult).toFixed(1)),
          fat: Number(((ing.fat || 0) * mult).toFixed(1)),
          fiber: Number(((ing.fiber || 0) * mult).toFixed(1)),
        }));
        setMeals((p) => [{
          id: uid(),
          date: selectedDate,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          category: autoCategory(),
          name: `${recipe.name}${mult !== 1 ? ` (${mult}x)` : ''}`,
          items
        }, ...p]);
        setActiveTab('dashboard');
      };

      const todaysMeals = useMemo(() => meals.filter((m) => m.date === selectedDate), [meals, selectedDate]);
      const dailyTotals = useMemo(() => todaysMeals.reduce((acc, m) => {
        m.items.forEach((it) => {
          acc.calories += Number(it.calories) || 0;
          acc.protein += Number(it.protein) || 0;
          acc.carbs += Number(it.carbs) || 0;
          acc.fat += Number(it.fat) || 0;
          acc.fiber += Number(it.fiber) || 0;
        });
        return acc;
      }, { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 }), [todaysMeals]);

      const recentForCategory = useMemo(() => {
        const seen = new Set();
        const out = [];
        const sorted = [...meals].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
        for (const m of sorted) {
          if (mealCategory(m) !== trackCategory) continue;
          const key = `${(m.name || '').trim().toLowerCase()}|${m.items.map((i) => i.name).join(',').toLowerCase()}`;
          if (seen.has(key)) continue;
          seen.add(key);
          out.push(m);
          if (out.length === 3) break;
        }
        return out;
      }, [meals, trackCategory]);

      const favoritesSorted = [...favorites].sort((a, b) => (b.category === trackCategory) - (a.category === trackCategory));
      const favoritesBlock = favorites.length > 0 ? (
        <div className="space-y-1.5">
          <p className="text-[11px] text-zinc-400">Favourites</p>
          {favoritesSorted.map((f) => (
            <button key={f.id} onClick={() => addRecentToDraft(f)} className="w-full flex items-center justify-between gap-2 bg-zinc-900 border border-amber-500/20 rounded-xl p-2.5 text-left text-xs">
              <span className="min-w-0">
                <span className="block font-medium truncate">★ {f.name}</span>
                <span className="block text-[11px] text-zinc-400 truncate">{f.items.map((i) => i.name).join(', ')}</span>
              </span>
              <span className="shrink-0 text-zinc-300">{Math.round(sumItems(f.items).calories)} kcal</span>
            </button>
          ))}
        </div>
      ) : null;

      const recentBlock = recentForCategory.length > 0 ? (
        <div className="space-y-1.5">
          <p className="text-[11px] text-zinc-400">Recent {trackCategory} entries</p>
          {recentForCategory.map((m) => (
            <button key={m.id} onClick={() => addRecentToDraft(m)} className="w-full flex items-center justify-between gap-2 bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-left text-xs">
              <span className="min-w-0">
                <span className="block font-medium truncate">{m.name}</span>
                <span className="block text-[11px] text-zinc-400 truncate">{m.items.map((i) => i.name).join(', ')}</span>
              </span>
              <span className="shrink-0 text-zinc-300">{Math.round(sumItems(m.items).calories)} kcal</span>
            </button>
          ))}
        </div>
      ) : null;

      const analyticsData = useMemo(() => {
        const days = [];
        const base = new Date();
        for (let i = analyticsRange - 1; i >= 0; i--) {
          const d = new Date(base);
          d.setDate(base.getDate() - i);
          const dStr = toDateStr(d);
          const dm = meals.filter((m) => m.date === dStr);
          let cal = 0;
          dm.forEach((m) => m.items.forEach((it) => cal += Number(it.calories) || 0));
          days.push({ date: dStr.slice(5), calories: Math.round(cal), goal: goalsFor(dStr).calories });
        }
        return days;
      }, [meals, analyticsRange, goals, trainingGoals, dayOverrides, trainingWeekdays]);
      const avgGoal = Math.round(analyticsData.reduce((a, d) => a + d.goal, 0) / Math.max(1, analyticsData.length));
      const loggedDays = analyticsData.filter((d) => d.calories > 0);
      const avgCalories = loggedDays.length ? Math.round(loggedDays.reduce((a, d) => a + d.calories, 0) / loggedDays.length) : 0;

      const exportBackup = () => {
        const blob = new Blob([JSON.stringify({ app: 'macrolens', version: 3, goals, trainingGoals, dayTypes: dayOverrides, trainingWeekdays, favorites, meals, recipes: savedRecipes, foods: customFoods }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `macrolens-backup-${getTodayStr()}.json`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        setBackupMsg('Backup downloaded.');
      };
      const importBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const d = JSON.parse(ev.target.result);
            if (d.app !== 'macrolens') throw new Error('bad');
            if (!window.confirm('Replace the data on this device with this backup?')) return;
            setGoals({ ...DEFAULT_GOALS, ...(d.goals || {}) });
            setTrainingGoals({ ...DEFAULT_GOALS, ...(d.trainingGoals || d.goals || {}) });
            setDayOverrides(d.dayTypes && typeof d.dayTypes === 'object' && !Array.isArray(d.dayTypes) ? d.dayTypes : {});
            setTrainingWeekdays(Array.isArray(d.trainingWeekdays) ? d.trainingWeekdays.filter((n) => Number.isInteger(n) && n >= 0 && n <= 6) : []);
            setFavorites(Array.isArray(d.favorites) ? d.favorites.filter((x) => x && x.name && Array.isArray(x.items)) : []);
            setMeals(Array.isArray(d.meals) ? d.meals.filter((x) => x && Array.isArray(x.items)) : []);
            setSavedRecipes(Array.isArray(d.recipes) ? d.recipes : []);
            setCustomFoods(Array.isArray(d.foods) ? d.foods : []);
            setBackupMsg('Backup restored.');
          } catch (err) {
            setBackupMsg('That file is not a MacroLens backup.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };
      const openFoodEditor = (food) => {
        setFoodError(''); setFoodAiText(''); setFoodPhotos([]); setFoodManual(EMPTY_INGREDIENT);
        setFoodDraft(food
          ? { ...JSON.parse(JSON.stringify(food)), servings: String(food.servings), totalWeight: food.totalWeight ? String(food.totalWeight) : '' }
          : { id: null, name: '', servings: '1', unitLabel: 'serving', totalWeight: '', ingredients: [] });
        setFoodModalOpen(true);
      };
      const closeFoodEditor = () => { setFoodModalOpen(false); setFoodDraft(null); setFoodError(''); };
      const patchFood = (patch) => setFoodDraft((d) => ({ ...d, ...patch }));
      const addFoodIngredient = (item) => setFoodDraft((d) => ({ ...d, ingredients: [...d.ingredients, item] }));
      const updateFoodIngredientWeight = (id, w) => setFoodDraft((d) => ({
        ...d, ingredients: d.ingredients.map((i) => i.id === id ? scaleItem(i, Math.max(0, Number(w) || 0)) : i)
      }));
      const removeFoodIngredient = (id) => setFoodDraft((d) => ({ ...d, ingredients: d.ingredients.filter((i) => i.id !== id) }));

      const handleFoodAi = async () => {
        if (!foodAiText.trim() && foodPhotos.length === 0) return;
        setFoodError(''); setFoodLoading(true);
        try {
          const prompt = `Parse these recipe ingredients into items with gram weights and macros for exactly the amounts given${foodAiText.trim() ? `: "${foodAiText}"` : ''}.${foodPhotos.length ? ' Use the attached photo(s), such as an ingredient list, nutrition labels or the dish itself, to identify ingredients and amounts.' : ''} Use the raw, uncooked state unless a cooked state is stated. If the user states nutrition values for a product (for example per 100g), use those exact numbers scaled to the amount given instead of estimating.
          Return strictly JSON: { "items": [{ "name": "String", "weight_g": Number, "calories": Number, "protein": Number, "carbs": Number, "fat": Number, "fiber": Number }] }`;
          const res = await callGeminiJson(prompt, foodPhotos);
          const items = (res.items || []).map(makeItem);
          if (items.length === 0) throw new Error('No ingredients found. List each one with a weight, for example: 500g flour, 325g water.');
          setFoodDraft((d) => ({ ...d, ingredients: [...d.ingredients, ...items] }));
          setFoodAiText('');
          setFoodPhotos([]);
        } catch (err) {
          setFoodError(err.message);
        } finally {
          setFoodLoading(false);
        }
      };

      const addManualIngredient = () => {
        const m = foodManual;
        if (!m.name.trim()) { setFoodError('Name the ingredient.'); return; }
        if (!(Number(m.weight_g) > 0)) { setFoodError('Enter the amount in grams.'); return; }
        setFoodError('');
        addFoodIngredient(makeItem({ ...m, name: m.name.trim() }));
        setFoodManual(EMPTY_INGREDIENT);
      };

      const saveFood = () => {
        const d = foodDraft;
        const name = d.name.trim();
        const servings = Number(d.servings);
        if (!name) { setFoodError('Give the food a name.'); return; }
        if (!(servings > 0)) { setFoodError('Enter how many servings this makes.'); return; }
        if (d.ingredients.length === 0) { setFoodError('Add at least one ingredient.'); return; }
        if (customFoods.some((f) => f.id !== d.id && f.name.trim().toLowerCase() === name.toLowerCase())) { setFoodError('You already have a food with that name.'); return; }
        const food = {
          id: d.id || uid(), name, servings,
          unitLabel: (d.unitLabel || '').trim() || 'serving',
          totalWeight: Number(d.totalWeight) > 0 ? Number(d.totalWeight) : 0,
          ingredients: d.ingredients,
          totals: sumItems(d.ingredients),
        };
        setCustomFoods((p) => d.id ? p.map((f) => f.id === food.id ? food : f) : [...p, food]);
        closeFoodEditor();
        setRecipeSubTab('foods');
      };

      const logCustomFood = (food, qty) => {
        const q = Number(qty);
        if (!(q > 0)) return;
        setMeals((p) => [{
          id: uid(),
          date: selectedDate,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          category: autoCategory(),
          name: `${food.name}${q !== 1 ? ` (${q} ${food.unitLabel || 'serving'})` : ''}`,
          items: [foodToItem(food, 'serving', q)]
        }, ...p]);
        setActiveTab('dashboard');
      };

      const saveRecipe = (r) => setSavedRecipes((p) => p.some((x) => x.name === r.name) ? p : [...p, r]);

      const calPct = Math.min(100, Math.round((dailyTotals.calories / (activeGoals.calories || 1)) * 100));
      const ringRadius = 66;
      const ringCircumference = 2 * Math.PI * ringRadius;
      const ringOffset = ringCircumference - (calPct / 100) * ringCircumference;

      return (
        <div className="min-h-[100dvh] bg-[#09090B] text-[#FAFAFA] pb-32">
          <header className="sticky top-0 z-20 bg-[#09090B]/90 backdrop-blur-md border-b border-zinc-800 px-4 pb-3.5 pt-3.5 safe-top">
            <div className="max-w-xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-blue-500">
                  <Icon name="flame" className="w-4 h-4" />
                </div>
                <div>
                  <h1 className="text-sm font-semibold tracking-tight">MacroLens</h1>
                  <p className="text-[11px] text-zinc-400">AI nutrition tracker</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="date"
                  value={selectedDate}
                  onChange={(e) => { if (e.target.value) setSelectedDate(e.target.value); }}
                  className="bg-zinc-900 border border-zinc-800 text-xs text-zinc-200 rounded-lg px-2.5 py-1.5"
                />
                <button
                  onClick={() => openTrackModal('hub')}
                  className="flex items-center gap-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>Track food</span>
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-xl mx-auto px-4 pt-5 space-y-5">
            {!apiKey && (
              <div className="bg-zinc-900 border border-amber-500/30 rounded-xl p-3 flex items-center justify-between text-xs">
                <span className="text-zinc-300">Add a free Gemini API key in Goals to turn on photo, voice and AI recipes.</span>
                <button onClick={() => setActiveTab('settings')} className="text-amber-400 font-semibold ml-2">Setup</button>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <>
                <div className="flex items-center justify-between text-xs gap-2">
                  <button onClick={() => setDayOverrides((o) => ({ ...o, [selectedDate]: dayType === 'training' ? 'standard' : 'training' }))} className={`px-3 py-1.5 rounded-full border ${dayType === 'training' ? 'bg-emerald-600/20 border-emerald-500/40 text-emerald-300' : 'bg-zinc-900 border-zinc-800 text-zinc-300'}`}>{dayType === 'training' ? 'Training day' : 'Standard day'} · tap to switch</button>
                  <button onClick={openCopy} className="text-blue-400 px-2 py-1.5">Copy from another day</button>
                </div>

                <section className="bg-[#18181B] border border-[#27272A] rounded-2xl p-5">
                  <div className="flex flex-col sm:flex-row items-center gap-6">
                    <div className="relative flex items-center justify-center shrink-0">
                      <svg className="w-36 h-36 -rotate-90 transform">
                        <circle cx="72" cy="72" r={ringRadius} stroke="#27272A" strokeWidth="11" fill="transparent" />
                        <circle
                          cx="72" cy="72" r={ringRadius} stroke="#FAFAFA" strokeWidth="11"
                          strokeDasharray={ringCircumference} strokeDashoffset={ringOffset}
                          strokeLinecap="round" fill="transparent"
                        />
                      </svg>
                      <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
                        <span className="text-2xl font-bold">{Math.round(dailyTotals.calories)}</span>
                        <span className="text-[11px] text-zinc-400">/ {activeGoals.calories} kcal</span>
                      </div>
                    </div>

                    <div className="w-full space-y-3">
                      {[
                        { l: 'Protein', v: dailyTotals.protein, g: activeGoals.protein, c: 'bg-blue-500', t: 'text-blue-400' },
                        { l: 'Carbohydrates', v: dailyTotals.carbs, g: activeGoals.carbs, c: 'bg-amber-500', t: 'text-amber-400' },
                        { l: 'Fats', v: dailyTotals.fat, g: activeGoals.fat, c: 'bg-pink-500', t: 'text-pink-400' },
                        { l: 'Fiber', v: dailyTotals.fiber, g: activeGoals.fiber, c: 'bg-violet-500', t: 'text-violet-400' },
                      ].map((m) => (
                        <div key={m.l} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="text-zinc-300 font-medium">{m.l}</span>
                            <span className="text-zinc-400"><strong className={m.t}>{Math.round(m.v)}g</strong> / {m.g}g</span>
                          </div>
                          <div className="h-2 w-full bg-zinc-800 rounded-full overflow-hidden">
                            <div className={`h-full ${m.c} rounded-full`} style={{ width: `${Math.min(100, Math.round((m.v / (m.g || 1)) * 100))}%` }} />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>

                <div className="grid grid-cols-3 gap-2.5">
                  <button onClick={() => openTrackModal('manual')} className="bg-[#18181B] border border-[#27272A] rounded-xl p-3 flex flex-col items-center gap-1.5 text-emerald-400">
                    <Icon name="scale" className="w-4 h-4" />
                    <span className="text-xs font-medium text-zinc-200">Manual log</span>
                  </button>
                  <button onClick={() => openTrackModal('voice')} className="bg-[#18181B] border border-[#27272A] rounded-xl p-3 flex flex-col items-center gap-1.5 text-blue-400">
                    <Icon name="mic" className="w-4 h-4" />
                    <span className="text-xs font-medium text-zinc-200">Describe meal</span>
                  </button>
                  <button onClick={() => openTrackModal('photo')} className="bg-[#18181B] border border-[#27272A] rounded-xl p-3 flex flex-col items-center gap-1.5 text-violet-400">
                    <Icon name="camera" className="w-4 h-4" />
                    <span className="text-xs font-medium text-zinc-200">Snap photo</span>
                  </button>
                </div>

                {favorites.length > 0 && (
                  <section className="space-y-2">
                    <h2 className="text-sm font-semibold text-zinc-200">Favourites</h2>
                    <div className="flex gap-2 overflow-x-auto pb-1">
                      {[...favorites].sort((a, b) => (b.category === autoCategory()) - (a.category === autoCategory())).map((f) => (
                        <button key={f.id} onClick={() => quickAddFavorite(f)} className="shrink-0 bg-[#18181B] border border-[#27272A] rounded-xl px-3 py-2 text-left text-xs">
                          <span className="block font-medium max-w-[9rem] truncate">★ {f.name}</span>
                          <span className="block text-[11px] text-zinc-400">{Math.round(sumItems(f.items).calories)} kcal · tap to add</span>
                        </button>
                      ))}
                    </div>
                  </section>
                )}

                <section className="space-y-3">
                  <h2 className="text-sm font-semibold text-zinc-200">Logged Meals ({todaysMeals.length})</h2>
                  {todaysMeals.length === 0 ? (
                    <div className="bg-[#18181B] border border-[#27272A] rounded-2xl p-8 text-center space-y-2">
                      <p className="text-sm font-medium text-zinc-200">Ready to start tracking today</p>
                      <p className="text-xs text-zinc-400">Tap "Track food" to log manually, describe a meal, or snap a photo.</p>
                    </div>
                  ) : (
                    CATEGORIES.map((cat) => {
                      const group = todaysMeals.filter((m) => mealCategory(m) === cat);
                      if (group.length === 0) return null;
                      const groupCal = Math.round(sumItems(group.flatMap((m) => m.items)).calories);
                      return (
                    <div key={cat} className="space-y-2">
                      <div className="flex justify-between text-xs px-1"><span className="font-semibold text-zinc-300">{cat}</span><span className="text-zinc-400">{groupCal} kcal</span></div>
                      {group.map((meal) => {
                      const mTotals = meal.items.reduce((a, i) => ({
                        cal: a.cal + (Number(i.calories) || 0),
                        p: a.p + (Number(i.protein) || 0),
                        c: a.c + (Number(i.carbs) || 0),
                        f: a.f + (Number(i.fat) || 0),
                        fib: a.fib + (Number(i.fiber) || 0),
                      }), { cal: 0, p: 0, c: 0, f: 0, fib: 0 });
                      const isOpen = expandedMealId === meal.id;
                      return (
                        <div key={meal.id} className="bg-[#18181B] border border-[#27272A] rounded-2xl overflow-hidden">
                          <div onClick={() => setExpandedMealId(isOpen ? null : meal.id)} role="button" aria-expanded={isOpen} className="p-4 flex items-center justify-between cursor-pointer">
                            <div>
                              <div className="flex items-center gap-2">
                                <h3 className="text-sm font-semibold">{meal.name}</h3>
                                <span className="text-[11px] text-zinc-400">{meal.time}</span>
                              </div>
                              <div className="flex flex-wrap gap-3 mt-1 text-xs">
                                <span className="font-medium">{Math.round(mTotals.cal)} kcal</span>
                                <span className="text-blue-400">{mTotals.p.toFixed(1)}g P</span>
                                <span className="text-amber-400">{mTotals.c.toFixed(1)}g C</span>
                                <span className="text-pink-400">{mTotals.f.toFixed(1)}g F</span>
                                <span className="text-violet-400">{mTotals.fib.toFixed(1)}g Fib</span>
                              </div>
                            </div>
                            <div className="flex items-center gap-2">
                              <button onClick={(e) => { e.stopPropagation(); if (window.confirm(`Delete "${meal.name}"?`)) setMeals((p) => p.filter((x) => x.id !== meal.id)); }} aria-label="Delete meal" className="p-2 text-zinc-500 hover:text-rose-400">
                                <Icon name="trash" />
                              </button>
                              <Icon name={isOpen ? "chevronUp" : "chevronDown"} className="w-4 h-4 text-zinc-400" />
                            </div>
                          </div>
                          {isOpen && (
                            <div className="border-t border-zinc-800 bg-zinc-950/60 p-3 space-y-2">

                  </div>
                  {same && <p className="text-[11px] text-amber-300">Pick a different day than the one you are copying into.</p>}
                  {list.length === 0 ? <p className="text-xs text-zinc-500">Nothing logged on this day.</p> : CATEGORIES.map((cat) => {
                    const group = list.filter((m) => mealCategory(m) === cat);
                    if (group.length === 0) return null;
                    return (
                      <div key={cat} className="space-y-1.5">
                        <div className="flex justify-between text-xs">
                          <span className="font-semibold text-zinc-300">{cat}</span>
                          <button onClick={() => setCopyUnchecked(Object.fromEntries(list.filter((m) => mealCategory(m) !== cat).map((m) => [m.id, true])))} className="text-blue-400">Only {cat.toLowerCase()}</button>
                        </div>
                        {group.map((m) => (
                          <label key={m.id} className="flex items-center gap-3 bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs cursor-pointer">
                            <input type="checkbox" checked={!copyUnchecked[m.id]} onChange={() => setCopyUnchecked((u) => ({ ...u, [m.id]: !u[m.id] }))} className="w-4 h-4" />
                            <span className="min-w-0 flex-1">
                              <span className="block font-medium truncate">{m.name}</span>
                              <span className="block text-[11px] text-zinc-400">{Math.round(sumItems(m.items).calories)} kcal</span>
                            </span>
                          </label>
                        ))}
                      </div>
                    );
                  })}
                  <button onClick={confirmCopy} disabled={same || chosen.length === 0} className="w-full bg-blue-600 disabled:opacity-40 text-white text-xs font-semibold py-3 rounded-xl">Copy {chosen.length} {chosen.length === 1 ? 'meal' : 'meals'} to {formatDay(selectedDate)}</button>
                </div>
              </div>
            );
          })()}

          {toast && (
            <div className="fixed inset-x-0 bottom-24 z-[70] flex justify-center px-4 pointer-events-none">
              <div className="pointer-events-auto bg-zinc-800 border border-zinc-700 text-xs rounded-xl px-4 py-2.5 flex items-center gap-3 shadow-lg" role="status">
                <span>{toast.text}</span>
                {toast.undoIds && <button onClick={undoToast} className="text-blue-400 font-semibold">Undo</button>}
              </div>
            </div>
          )}

          {scanOpen && (
            <BarcodeScanner
              onClose={() => setScanOpen(null)}
              onAdd={(item) => { if (scanOpen === 'meal') setDraftItems((p) => [...p, item]); else addFoodIngredient(item); }}
            />
          )}

          <nav className="fixed bottom-0 inset-x-0 z-30 bg-[#09090B]/95 backdrop-blur-md border-t border-zinc-800 px-4 pt-2 pb-2 safe-bottom">
            <div className="max-w-xl mx-auto grid grid-cols-4 gap-2">
              {[
                { id: 'dashboard', label: 'Daily', icon: 'utensils' },
                { id: 'recipes', label: 'Recipes', icon: 'book' },
                { id: 'analytics', label: 'Analytics', icon: 'chart' },
                { id: 'settings', label: 'Goals', icon: 'settings' },
              ].map((t) => (
                <button key={t.id} onClick={() => { setAiError(''); setActiveTab(t.id); }} className={`flex flex-col items-center py-1.5 rounded-xl ${activeTab === t.id ? 'text-blue-400' : 'text-zinc-400'}`}>
                  <Icon name={t.icon} className="w-4 h-4" />
                  <span className="text-[11px] mt-1 font-medium">{t.label}</span>
                </button>
              ))}
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
